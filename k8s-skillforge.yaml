apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-server
  labels:
    app: skillforge-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skillforge-server
  template:
    metadata:
      labels:
        app: skillforge-server
    spec:
      containers:
        - name: skillforge-nest
          image: ghcr.io/takiyo0/skillforge-nest:49b64ce3a14fbaf0115367add36a719b73d1c4db
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: skillforge-secret

---

apiVersion: v1
kind: Service
metadata:
  name: skillforge-server
  labels:
    app: skillforge-server
spec:
  sessionAffinity: None
  selector:
    app: skillforge-server
  ports:
    - name: http
      port: 80
      targetPort: 3000
      appProtocol: http

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skillforge-server
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "skillforge.mika.kivotos.top"
    - "skillforge.takiyo.us"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: skillforge-server
          port: 80