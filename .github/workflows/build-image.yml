name: Build, Push Image and Deploy

on:
  push:
    branches: [ master ]

env:
  IMAGE_NAME: ghcr.io/takiyo0/skillforge-nest

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: PRODUCTION
    outputs:
      should_build: ${{ steps.check_build.outputs.is_build }}
    permissions:
      contents: write
      packages: write
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Check commit message for build prefix
        id: check_build
        run: |
          if [[ "${{ github.event.head_commit.message }}" == build:* ]]; then
            echo "is_build=true" >> $GITHUB_OUTPUT
          else
            echo "is_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_build.outputs.is_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.check_build.outputs.is_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_build.outputs.is_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_API=${{ vars.VITE_BASE_API }}
            VITE_BASE_S3=${{ vars.VITE_BASE_S3 }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=SkillForge Nest
            org.opencontainers.image.description=This is an image for the SkillForge Nest application.
            org.opencontainers.image.created=${{ steps.build.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=SkillForge
            org.opencontainers.image.authors=${{ github.actor }}

      - name: Update image tag in k8s-skillforge.yaml
        if: steps.check_build.outputs.is_build == 'true'
        run: |
          sed -i "s|image: ghcr.io/takiyo0/skillforge-nest:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" \
            k8s-skillforge.yaml

      - name: Commit changes
        if: steps.check_build.outputs.is_build == 'true'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update image tag to ${{ env.IMAGE_NAME }}:${{ github.sha }} [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: k8s-skillforge.yaml

      - name: Skip push (no release prefix)
        if: steps.check_build.outputs.is_build == 'false'
        run: echo "Skipping Docker push due to commit message does not start with 'build:'"

  deploy-portainer:
    name: Deploy to Kyoko-SG-001 via Portainer
    runs-on: ubuntu-latest
    needs: build
    environment: PRODUCTION
    if: needs.build.outputs.should_build == 'true'
    steps:
      - name: Trigger Portainer Redeploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.PORTAINER_SF_NEST_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.PORTAINER_SF_NEST_CLIENT_SECRET }}" \
            "${{ secrets.PORTAINER_SF_NEST_WEBHOOK }}")
          echo "Webhook response: $STATUS"
          if [ "$STATUS" != "204" ]; then
            echo "::error::Failed ($STATUS)"
            exit 1
          fi

  deploy-kivotos-k8s:
    name: Deploy to Kivotos Cluster via ArgoCD
    runs-on: ubuntu-latest
    needs: build
    environment: PRODUCTION
    if: needs.build.outputs.should_build == 'true'
    steps:
      - name: Trigger ArgoCD Resync
        env:
          WEBHOOK_SECRET: ${{ secrets.ARGOCD_WEBHOOK_SECRET_HMAC }}
        run: |
          PAYLOAD='{"repository":{"html_url":"https://github.com/takiyo0/skillforge-nest","full_name":"takiyo0/skillforge-nest"},"ref":"refs/heads/master"}'
          SIGNATURE="sha256=$WEBHOOK_SECRET"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD" \
            "${{ vars.ARGOCD_API_SERVER }}/api/webhook")
          echo "ArgoCD response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Failed ($STATUS)"
            exit 1
          fi

  notify:
    name: Deployment Info
    runs-on: ubuntu-latest
    needs: [ build, deploy-portainer, deploy-kivotos-k8s ]
    if: always() && needs.build.outputs.should_build == 'true'
    environment:
      name: PRODUCTION
      url: ${{ vars.APP_URL }}
    steps:
      - name: Write deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Kyoko-SG-001 | ${{ needs.deploy-portainer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kivotos K8s | ${{ needs.deploy-kivotos-k8s.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.IMAGE_NAME }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | [${{ vars.APP_URL }}](${{ vars.APP_URL }}) |" >> $GITHUB_STEP_SUMMARY